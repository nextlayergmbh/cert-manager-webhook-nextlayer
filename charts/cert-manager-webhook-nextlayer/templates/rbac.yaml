apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cert-manager-webhook-nextlayer.fullname" . }}
  namespace: {{ include "cert-manager-webhook-nextlayer.namespace" . }}
  labels:
    {{- include "cert-manager-webhook-nextlayer.labels" . | nindent 4 }}
---
# Grant the webhook permission to read the ConfigMap containing the Kubernetes
# apiserver's requestheader-ca-certificate.
# This ConfigMap is automatically created by the Kubernetes apiserver.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cert-manager-webhook-nextlayer.fullname" . }}:webhook-authentication-reader
  namespace: kube-system
  labels:
    {{- include "cert-manager-webhook-nextlayer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "cert-manager-webhook-nextlayer.fullname" . }}
    namespace: {{ include "cert-manager-webhook-nextlayer.namespace" . }}
---
# apiserver gets the auth-delegator role to delegate auth decisions to
# the core apiserver
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cert-manager-webhook-nextlayer.fullname" . }}:auth-delegator
  labels:
    {{- include "cert-manager-webhook-nextlayer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "cert-manager-webhook-nextlayer.fullname" . }}
    namespace: {{ include "cert-manager-webhook-nextlayer.namespace" . }}
---
# Grant cert-manager permission to validate using our apiserver
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cert-manager-webhook-nextlayer.fullname" . }}:domain-solver
  labels:
    {{- include "cert-manager-webhook-nextlayer.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - {{ .Values.groupName | quote }}
    resources:
      - "*"
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cert-manager-webhook-nextlayer.fullname" . }}:domain-solver
  labels:
    {{- include "cert-manager-webhook-nextlayer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cert-manager-webhook-nextlayer.fullname" . }}:domain-solver
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ .Values.certManager.serviceAccountName }}
    namespace: {{ .Values.certManager.namespace }}
    {{- if .Values.rbac.secretReader.enabled }}
{{- $namespaces := .Values.rbac.secretReader.namespaces | default (list .Values.certManager.namespace) }}
{{- range $ns := $namespaces }}
---
# Allow the webhook to read the Secrets holding the nextlayer API credentials
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cert-manager-webhook-nextlayer.fullname" $ }}:secret-reader
  namespace: {{ $ns }}
  labels:
    {{- include "cert-manager-webhook-nextlayer.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    {{- with $.Values.rbac.secretReader.secretNames }}
    resourceNames:
      {{- toYaml . | nindent 6 }}
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cert-manager-webhook-nextlayer.fullname" $ }}:secret-reader
  namespace: {{ $ns }}
  labels:
    {{- include "cert-manager-webhook-nextlayer.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cert-manager-webhook-nextlayer.fullname" $ }}:secret-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "cert-manager-webhook-nextlayer.fullname" $ }}
    namespace: {{ include "cert-manager-webhook-nextlayer.namespace" $ }}
{{- end }}
{{- end }}
{{- if .Values.rbac.flowcontrol.enabled }}
---
# Allow the webhook's embedded apiserver to watch API Priority and Fairness config
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cert-manager-webhook-nextlayer.fullname" . }}:flowcontrol
  labels:
    {{- include "cert-manager-webhook-nextlayer.labels" . | nindent 4 }}
rules:
  - apiGroups: ["flowcontrol.apiserver.k8s.io"]
    resources: ["flowschemas", "prioritylevelconfigurations"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cert-manager-webhook-nextlayer.fullname" . }}:flowcontrol
  labels:
    {{- include "cert-manager-webhook-nextlayer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cert-manager-webhook-nextlayer.fullname" . }}:flowcontrol
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "cert-manager-webhook-nextlayer.fullname" . }}
    namespace: {{ include "cert-manager-webhook-nextlayer.namespace" . }}
{{- end }}
