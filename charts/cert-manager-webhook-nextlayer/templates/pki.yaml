---
# Create a selfsigned Issuer, in order to create a root CA certificate for
# signing webhook serving certificates
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "cert-manager-webhook-nextlayer.selfSignedIssuer" . }}
  namespace: {{ include "cert-manager-webhook-nextlayer.namespace" . }}
  labels:
    {{- include "cert-manager-webhook-nextlayer.labels" . | nindent 4 }}
spec:
  selfSigned: {}

---
# Generate a CA Certificate used to sign certificates for the webhook
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "cert-manager-webhook-nextlayer.rootCACertificate" . }}
  namespace: {{ include "cert-manager-webhook-nextlayer.namespace" . }}
  labels:
    {{- include "cert-manager-webhook-nextlayer.labels" . | nindent 4 }}
spec:
  secretName: {{ include "cert-manager-webhook-nextlayer.rootCACertificate" . }}
  duration: 43800h # 5y
  issuerRef:
    name: {{ include "cert-manager-webhook-nextlayer.selfSignedIssuer" . }}
    kind: Issuer
  commonName: "ca.{{ include "cert-manager-webhook-nextlayer.fullname" . }}.{{ include "cert-manager-webhook-nextlayer.namespace" . }}"
  isCA: true

---
# Create an Issuer that uses the above generated CA certificate to issue certs
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "cert-manager-webhook-nextlayer.rootCAIssuer" . }}
  namespace: {{ include "cert-manager-webhook-nextlayer.namespace" . }}
  labels:
    {{- include "cert-manager-webhook-nextlayer.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ include "cert-manager-webhook-nextlayer.rootCACertificate" . }}

---
# Finally, generate a serving certificate for the webhook to use
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "cert-manager-webhook-nextlayer.servingCertificate" . }}
  namespace: {{ include "cert-manager-webhook-nextlayer.namespace" . }}
  labels:
    {{- include "cert-manager-webhook-nextlayer.labels" . | nindent 4 }}
spec:
  secretName: {{ include "cert-manager-webhook-nextlayer.servingCertificate" . }}
  duration: 8760h # 1y
  issuerRef:
    name: {{ include "cert-manager-webhook-nextlayer.rootCAIssuer" . }}
  dnsNames:
  - {{ include "cert-manager-webhook-nextlayer.fullname" . }}
  - {{ include "cert-manager-webhook-nextlayer.fullname" . }}.{{ include "cert-manager-webhook-nextlayer.namespace" . }}
  - {{ include "cert-manager-webhook-nextlayer.fullname" . }}.{{ include "cert-manager-webhook-nextlayer.namespace" . }}.svc
