apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.{{ .Values.groupName }}
  labels:
    {{- include "cert-manager-webhook-nextlayer.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: "{{ include "cert-manager-webhook-nextlayer.namespace" . }}/{{ include "cert-manager-webhook-nextlayer.servingCertificate" . }}"
spec:
  group: {{ .Values.groupName | quote }}
  groupPriorityMinimum: 1000
  versionPriority: 15
  service:
    name: {{ include "cert-manager-webhook-nextlayer.fullname" . }}
    namespace: {{ include "cert-manager-webhook-nextlayer.namespace" . }}
    port: {{ include "cert-manager-webhook-nextlayer.servicePort" . }}
  version: v1alpha1
